[project]
name = "bloomberg-mcp"
version = "0.1.0"
description = "Bloomberg MCP Gateway: stateless MCP Streamable HTTP gateway over the Bloomberg Desktop API (blpapi)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Bloomberg MCP Gateway maintainers" }]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "blpapi",
  "mcp>=1.12",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "starlette>=0.40",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
tabular = ["pyarrow>=17.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "httpx2>=2.12",
  "tzdata>=2024.1",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
bloomberg-mcp = "bloomberg_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloomberg_mcp"]

[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"

[tool.uv.sources]
blpapi = { index = "bloomberg" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "ASYNC", "S", "T20",
]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/bloomberg_mcp/main.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src;stubs"
packages = ["bloomberg_mcp"]
pretty = true

# blpapi ships without type information; treat it as Any and honor its
# package re-exports. The native-adapter surface we rely on is documented in
# stubs/blpapi.pyi and verified against the installed package by tests.
[[tool.mypy.overrides]]
module = ["blpapi", "blpapi.*"]
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*", "yaml", "jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "mcp_types", "mcp_types.*"]
ignore_missing_imports = true
follow_untyped_imports = true
